<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="KUNKUN">
  <defs>
    <style>
      .word   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
                font-weight: 800; font-size: 104px; letter-spacing: -2px; fill: #2E2A26; }
      .handle { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
                font-size: 20px; letter-spacing: 1px; fill: #4E8A6B; }
      .dot { animation: soft 4.2s ease-in-out infinite; }
      .d2  { animation-delay: .45s; }
      .d3  { animation-delay: .9s; }
      @keyframes soft { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="178" rx="22" fill="#FBF6EC" stroke="#EDE3D2" stroke-width="2"/>

  <rect x="56" y="52" width="12" height="76" rx="6" fill="#F2D06B"/>

  <text class="word" x="92" y="128">KUNKUN</text>

  <circle class="dot"    cx="1026" cy="90" r="13" fill="#4E8A6B"/>
  <circle class="dot d2" cx="1074" cy="90" r="13" fill="#F2D06B"/>
  <circle class="dot d3" cx="1122" cy="90" r="13" fill="#C9768F"/>

  <text class="handle" x="1135" y="132" text-anchor="end">@kunkunblueberry</text>
</svg>
